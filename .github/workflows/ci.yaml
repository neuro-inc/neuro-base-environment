name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: All checks are passed
    uses: ./.github/workflows/test.yaml
    secrets: inherit
    permissions:
      contents: read
      packages: read

  approve:
    name: Approve bot PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && endsWith(github.actor, '[bot]')
    needs: test
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: metadata
        id: metadata
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for bot PRs
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish tested image
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      matrix:
        base-image:
          - nvidia/cuda:12.6.2-cudnn-devel-ubuntu24.04
          - nvidia/cuda:12.6.2-cudnn-runtime-ubuntu24.04
        dockerfile:
          - Dockerfile
          - Dockerfile.minimal
    env:
      IMAGE_NAME: ghcr.io/neuro-inc/base
      BASE_IMAGE: ${{ matrix.base-image }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get image tags
        id: get-image-tags
        run: |
          if [[ ${{ matrix.base-image }} =~ runtime ]]; then
            base_image_type="runtime"
          elif [[ ${{ matrix.base-image }} =~ devel ]]; then
            base_image_type="devel"
          fi
          if [[ ${{ matrix.dockerfile }} =~ minimal ]]; then
            base_image_type="$base_image_type-minimal"
          fi
          echo "base_image_type=$base_image_type" >> "$GITHUB_OUTPUT"
          echo "platform_image_tag=ghcr.io/neuro-inc/base:built-$base_image_type" >> "$GITHUB_OUTPUT"

      - name: Download tested image
        uses: actions/download-artifact@v8
        with:
          name: tested-image-${{ steps.get-image-tags.outputs.base_image_type }}

      - name: Load tested image
        env:
          PLATFORM_IMAGE_TAG: ${{ steps.get-image-tags.outputs.platform_image_tag }}
        run: |
          zstd --decompress --stdout tested-image.tar.zst | docker load
          docker image inspect "$PLATFORM_IMAGE_TAG" >/dev/null

      - name: List pip packages minimal
        if: matrix.dockerfile == 'Dockerfile.minimal'
        run: |
          docker run --tty --rm "$IMAGE_TAG" pip list
          docker run --tty --rm "$IMAGE_TAG" pip freeze > pip_dependencies.txt
        env:
          IMAGE_TAG: ${{ steps.get-image-tags.outputs.platform_image_tag }}

      - name: List pip packages
        if: matrix.dockerfile == 'Dockerfile'
        run: |
          docker run --tty --rm "$IMAGE_TAG" pip list
          docker run --tty --rm "$IMAGE_TAG" pip freeze > pip_dependencies.txt
          docker run --tty --rm "$IMAGE_TAG" bash -c "source /opt/conda/bin/activate tf && pip freeze" > pip_dependencies_tf.txt
          docker run --tty --rm "$IMAGE_TAG" bash -c "source /opt/conda/bin/activate torch && pip freeze" > pip_dependencies_torch.txt
        env:
          IMAGE_TAG: ${{ steps.get-image-tags.outputs.platform_image_tag }}

      - name: Push release
        env:
          BASE_IMAGE_TYPE: ${{ steps.get-image-tags.outputs.base_image_type }}
        run: |
          export TARGET_IMAGE_TAGS="latest-$BASE_IMAGE_TYPE,${GITHUB_REF#refs/tags/}-$BASE_IMAGE_TYPE"
          if [[ $BASE_IMAGE_TYPE == runtime ]]; then
            export TARGET_IMAGE_TAGS="latest,$TARGET_IMAGE_TAGS"
          fi
          echo "$TARGET_IMAGE_TAGS" > released_tags.txt
          make image_deploy
          if [[ $BASE_IMAGE_TYPE == runtime ]]; then
            TARGET_IMAGE_NAME="neuromation/base"
            make image_deploy
          fi

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-meta-${{ steps.get-image-tags.outputs.base_image_type }}
          path: |
            released_tags.txt
            pip_dependencies.txt
            pip_dependencies_tf.txt
            pip_dependencies_torch.txt
          if-no-files-found: ignore
          retention-days: 1

  release-notes:
    name: Update release notes
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          pattern: release-meta-*
          path: release-meta

      - name: Compose and update release notes
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const MAX_BODY_LENGTH = 125000;
            const baseImage = 'ghcr.io/neuro-inc/base';
            const root = 'release-meta';

            const tags = new Set();
            for (const dir of fs.readdirSync(root)) {
              const f = path.join(root, dir, 'released_tags.txt');
              if (!fs.existsSync(f)) continue;
              for (const t of fs.readFileSync(f, 'utf8').split(',')) {
                const tag = t.trim();
                if (tag) tags.add(tag);
              }
            }
            const dockerImages = [...tags].sort()
              .map(t => `- \`${baseImage}:${t}\``)
              .join('\n');

            const read = (p) => {
              try { return fs.readFileSync(path.join(root, p), 'utf8').trim(); }
              catch (e) { return ''; }
            };
            const pipBase = read('release-meta-runtime/pip_dependencies.txt');
            const pipTf = read('release-meta-runtime/pip_dependencies_tf.txt');
            const pipTorch = read('release-meta-runtime/pip_dependencies_torch.txt');

            const section = [
              '## Docker Images Released', '```', dockerImages, '```', '',
              '## Pip Dependencies', '```', pipBase, '```', '',
              '## Pip Dependencies torch env', '```', pipTorch, '```', '',
              '## Pip Dependencies tf env', '```', pipTf, '```',
            ].join('\n');

            const tagName = process.env.GITHUB_REF.replace('refs/tags/', '');
            const rel = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
            });

            const head = (rel.data.body || '').split('## Docker Images Released')[0].replace(/\s+$/, '');
            let body = head ? `${head}\n\n${section}` : section;
            if (body.length > MAX_BODY_LENGTH) body = body.slice(0, MAX_BODY_LENGTH);

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.data.id,
              body,
            });
            console.log(`Updated ${tagName} notes: ${tags.size} image tags, ${body.length} chars.`);
