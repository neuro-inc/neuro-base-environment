name: CI

on:
  push:
    branches: [master]
    tags: [v*.*.*]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        base-image:
          - nvidia/cuda:12.6.2-cudnn-devel-ubuntu24.04
          - nvidia/cuda:12.6.2-cudnn-runtime-ubuntu24.04
        dockerfile:
          - Dockerfile
          - Dockerfile.minimal
    env:
      IMAGE_NAME: ghcr.io/neuro-inc/base
      BASE_IMAGE: ${{ matrix.base-image }}
    name: Build, test and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout commit
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -U apolo-cli

      - name: Configure environment
        run: |
          source venv/bin/activate
          apolo config login-with-token ${{ secrets.CLIENT_TEST_E2E_USER_NAME }} https://api.dev.apolo.us/api/v1
          apolo config show

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get image tags
        id: get-image-tags
        run: |
          if [[ ${{ matrix.base-image }} =~ runtime ]]; then
            export BASE_IMAGE_TYPE="runtime";
          elif [[ ${{ matrix.base-image }} =~ devel ]]; then
            export BASE_IMAGE_TYPE="devel";
          fi
          if [[ ${{ matrix.dockerfile }} =~ minimal ]]; then
            export BASE_IMAGE_TYPE="$BASE_IMAGE_TYPE-minimal";
          fi
          echo "::set-output name=BASE_IMAGE_TYPE::$BASE_IMAGE_TYPE"
          echo "::set-output name=platform_image_tag::ghcr.io/neuro-inc/base:built-$BASE_IMAGE_TYPE"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/go /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image
        env:
          BASE_IMAGE_TYPE: ${{ steps.get-image-tags.outputs.BASE_IMAGE_TYPE }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          make image_build

      - name: List pip packages minimal
        if: ${{ matrix.dockerfile == 'Dockerfile.minimal' }}
        id: list-pip-packages-minimal
        run: |
          docker run --tty --rm ${{ steps.get-image-tags.outputs.platform_image_tag }} pip list
          docker run --tty --rm ${{ steps.get-image-tags.outputs.platform_image_tag }} pip freeze > pip_dependencies.txt
        env:
          IMAGE_TAG: ${{ steps.get-image-tags.outputs.platform_image_tag }}

      - name: List pip packages
        if: ${{ matrix.dockerfile == 'Dockerfile' }}
        id: list-pip-packages
        run: |
          docker run --tty --rm ${{ steps.get-image-tags.outputs.platform_image_tag }} pip list
          docker run --tty --rm ${{ steps.get-image-tags.outputs.platform_image_tag }} pip freeze > pip_dependencies.txt
          docker run --tty --rm ${{ steps.get-image-tags.outputs.platform_image_tag }} bash -c "source /opt/conda/bin/activate tf && pip freeze" > pip_dependencies_tf.txt
          docker run --tty --rm ${{ steps.get-image-tags.outputs.platform_image_tag }} bash -c "source /opt/conda/bin/activate torch && pip freeze" > pip_dependencies_torch.txt
        env:
          IMAGE_TAG: ${{ steps.get-image-tags.outputs.platform_image_tag }}

      - name: Test image
        env:
          BASE_IMAGE_TYPE: ${{ steps.get-image-tags.outputs.BASE_IMAGE_TYPE }}
          TEST_PRESET: cpu-large
        run: |
          source venv/bin/activate
          make e2e_neuro_push
          if [[ ${{ matrix.dockerfile }} =~ minimal ]]; then
            export TEST_CMD="bash /var/storage/dependencies.minimal.sh";
          fi
          make test_dependencies

      - name: Push release
        env:
          BASE_IMAGE_TYPE: ${{ steps.get-image-tags.outputs.BASE_IMAGE_TYPE }}
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          export TARGET_IMAGE_TAGS="latest-$BASE_IMAGE_TYPE,${GITHUB_REF#refs/tags/}-$BASE_IMAGE_TYPE";
          if [[ $BASE_IMAGE_TYPE == runtime ]]; then
            export TARGET_IMAGE_TAGS="latest,$TARGET_IMAGE_TAGS";
          fi
          echo "$TARGET_IMAGE_TAGS" > released_tags.txt
          make image_deploy
          if [[ $BASE_IMAGE_TYPE == runtime ]]; then
            # publish legacy images
            TARGET_IMAGE_NAME="neuromation/base"
            make image_deploy
          fi

      - name: Upload release metadata
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-meta-${{ steps.get-image-tags.outputs.BASE_IMAGE_TYPE }}
          path: |
            released_tags.txt
            pip_dependencies.txt
            pip_dependencies_tf.txt
            pip_dependencies_torch.txt
          if-no-files-found: ignore
          retention-days: 1

  # Single writer: compose the release notes once from all variants' metadata.
  release-notes:
    name: Update release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          pattern: release-meta-*
          path: release-meta

      - name: Compose and update release notes
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const MAX_BODY_LENGTH = 125000;
            const baseImage = 'ghcr.io/neuro-inc/base';
            const root = 'release-meta';

            // Aggregate the published image tags across every variant.
            const tags = new Set();
            for (const dir of fs.readdirSync(root)) {
              const f = path.join(root, dir, 'released_tags.txt');
              if (!fs.existsSync(f)) continue;
              for (const t of fs.readFileSync(f, 'utf8').split(',')) {
                const tag = t.trim();
                if (tag) tags.add(tag);
              }
            }
            const dockerImages = [...tags].sort()
              .map(t => `- \`${baseImage}:${t}\``)
              .join('\n');

            // Pip freezes come from the full runtime image (base + tf + torch envs).
            const read = (p) => {
              try { return fs.readFileSync(path.join(root, p), 'utf8').trim(); }
              catch (e) { return ''; }
            };
            const pipBase = read('release-meta-runtime/pip_dependencies.txt');
            const pipTf = read('release-meta-runtime/pip_dependencies_tf.txt');
            const pipTorch = read('release-meta-runtime/pip_dependencies_torch.txt');

            const section = [
              '## Docker Images Released', '```', dockerImages, '```', '',
              '## Pip Dependencies', '```', pipBase, '```', '',
              '## Pip Dependencies torch env', '```', pipTorch, '```', '',
              '## Pip Dependencies tf env', '```', pipTf, '```',
            ].join('\n');

            const tagName = process.env.GITHUB_REF.replace('refs/tags/', '');
            const rel = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
            });

            // Keep the hand-written notes above the auto section and replace any
            // previous auto section, so re-runs stay idempotent.
            const head = (rel.data.body || '').split('## Docker Images Released')[0].replace(/\s+$/, '');
            let body = head ? `${head}\n\n${section}` : section;
            if (body.length > MAX_BODY_LENGTH) body = body.slice(0, MAX_BODY_LENGTH);

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: rel.data.id,
              body,
            });
            console.log(`Updated ${tagName} notes: ${tags.size} image tags, ${body.length} chars.`);

  # Stable required-status-check context; matrix job names are variant-suffixed.
  check:
    name: CI success
    needs: build
    # always() so a failed/cancelled build still reports this check as failed.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any build matrix job did not succeed
        if: needs.build.result != 'success'
        run: |
          echo "build matrix result: ${{ needs.build.result }}"
          exit 1
      - name: Success
        run: echo "All build matrix jobs succeeded"
