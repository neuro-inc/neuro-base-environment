name: Tests

on:
  workflow_call: {}

jobs:
  build:
    name: Build and test image
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      matrix:
        base-image:
          - nvidia/cuda:12.6.2-cudnn-devel-ubuntu24.04
          - nvidia/cuda:12.6.2-cudnn-runtime-ubuntu24.04
        dockerfile:
          - Dockerfile
          - Dockerfile.minimal
    env:
      IMAGE_NAME: ghcr.io/neuro-inc/base
      BASE_IMAGE: ${{ matrix.base-image }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -U apolo-cli

      - name: Configure environment
        run: |
          source venv/bin/activate
          apolo config login-with-token "${{ secrets.CLIENT_TEST_E2E_USER_NAME }}" https://api.dev.apolo.us/api/v1
          apolo config show

      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get image tags
        id: get-image-tags
        run: |
          if [[ ${{ matrix.base-image }} =~ runtime ]]; then
            base_image_type="runtime"
          elif [[ ${{ matrix.base-image }} =~ devel ]]; then
            base_image_type="devel"
          fi
          if [[ ${{ matrix.dockerfile }} =~ minimal ]]; then
            base_image_type="$base_image_type-minimal"
          fi
          echo "base_image_type=$base_image_type" >> "$GITHUB_OUTPUT"
          echo "platform_image_tag=ghcr.io/neuro-inc/base:built-$base_image_type" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          BASE_IMAGE_TYPE: ${{ steps.get-image-tags.outputs.base_image_type }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: make image_build

      - name: Test image
        env:
          BASE_IMAGE_TYPE: ${{ steps.get-image-tags.outputs.base_image_type }}
          TEST_PRESET: cpu-large
        run: |
          source venv/bin/activate
          make e2e_neuro_push
          if [[ ${{ matrix.dockerfile }} =~ minimal ]]; then
            export TEST_CMD="bash /var/storage/dependencies.minimal.sh"
          fi
          make test_dependencies

      - name: Export tested image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          PLATFORM_IMAGE_TAG: ${{ steps.get-image-tags.outputs.platform_image_tag }}
        run: |
          docker save "$PLATFORM_IMAGE_TAG" | zstd --threads=0 -3 -o tested-image.tar.zst

      - name: Upload tested image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: tested-image-${{ steps.get-image-tags.outputs.base_image_type }}
          path: tested-image.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
